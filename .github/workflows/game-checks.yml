name: Card Game Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and preview boundaries
        run: |
          python scripts/sync-catalog.py --check
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/audit-release.py
      - name: Run all UI regressions under the hard CPU quota
        run: >-
          sh scripts/build-half-cpu.sh --run --rm
          -v "$PWD:/workspace" -w /workspace node:24-bookworm-slim
          sh -c 'npm ci --ignore-scripts && npm test'
  consolidated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run combat, real three-engine databases and same-database upgrades
        run: |
          mkdir "$RUNNER_TEMP/game-evidence"
          sh scripts/build-half-cpu.sh --run --rm -e GOMAXPROCS=1 \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/game-evidence:/out" \
            ubuntu:24.04 sh /src/docs/pr-six-unit-guilds/harness/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-game-evidence
          path: ${{ runner.temp }}/game-evidence/
          if-no-files-found: error
